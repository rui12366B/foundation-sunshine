name: Export pinned 503 debug source
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/export-503-debug-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44e25f3a49e1897d822f20d8fd6ceb0732c02529
          persist-credentials: false
      - name: Package tracked source only, excluding font binaries
        shell: python
        run: |
          import subprocess,pathlib,zipfile,hashlib,json
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          exclude={'.ttf','.otf','.woff','.woff2','.ttc','.otc','.eot','.dfont','.pfa','.pfb','.fon','.fnt','.bdf','.pcf'}
          hashes={}
          with zipfile.ZipFile('debug-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p=pathlib.Path(name)
                  if not name or not p.is_file() or p.is_symlink() or p.suffix.lower() in exclude: continue
                  data=p.read_bytes(); hashes[name]=hashlib.sha256(data).hexdigest(); z.writestr(name,data)
          pathlib.Path('debug-source-hashes.json').write_text(json.dumps(hashes,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-503-debug-source
          path: |
            debug-source.zip
            debug-source-hashes.json
          retention-days: 7
